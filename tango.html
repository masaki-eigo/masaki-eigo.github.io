<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WordDojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*
  Layout concept: home is a deck-management hub — "make a deck" is the hero action,
  the user's own decks are the main list, and the built-in word set is demoted to a
  thin horizontal strip labeled as a bundled sample. Studying any deck opens the same
  full-screen sparring view: one ink-stamped flashcard, flipped by tap, judged by a
  drag-swipe, tracked by a combo flame.
*/
:root{
  --bg:#E7EBDE; --panel:#DBE2CC; --panel-line:rgba(27,36,30,.14);
  --ink:#1B241E; --ink-soft:#56634F; --ink-faint:#7C8773;
  --accent:#C1432D; --accent-ink:#FFF6EE;
  --gold:#9C6E1C;
  --card-front:#1B241E; --card-front-ink:#F3EFE2; --card-front-sub:#C7CBB9;
  --card-back:#F6F3E6; --card-back-ink:#1B241E; --card-back-sub:#56634F;
  --good:#3E7D4C; --bad:#B7442F;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121810; --panel:#1C2518; --panel-line:rgba(231,236,217,.14);
    --ink:#E9EEDB; --ink-soft:#AAB79A; --ink-faint:#71806A;
    --accent:#E2663F; --accent-ink:#1E0E08;
    --gold:#D9A53B;
    --card-front:#242F1F; --card-front-ink:#F3EFE2; --card-front-sub:#9BA68A;
    --card-back:#1E2819; --card-back-ink:#E9EEDB; --card-back-sub:#AAB79A;
    --good:#5FAE6E; --bad:#E2663F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121810; --panel:#1C2518; --panel-line:rgba(231,236,217,.14);
  --ink:#E9EEDB; --ink-soft:#AAB79A; --ink-faint:#71806A;
  --accent:#E2663F; --accent-ink:#1E0E08;
  --gold:#D9A53B;
  --card-front:#242F1F; --card-front-ink:#F3EFE2; --card-front-sub:#9BA68A;
  --card-back:#1E2819; --card-back-ink:#E9EEDB; --card-back-sub:#AAB79A;
  --good:#5FAE6E; --bad:#E2663F;
  color-scheme:dark;
}

*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 32px;
  overflow-x:hidden;
}
html,body{height:100%;}
h1,h2,h3{font-family:"Shippori Mincho",serif; text-wrap:balance; margin:0;}
.mono{font-family:"DM Mono",monospace;}
button{font:inherit; cursor:pointer;}
input,textarea{font:inherit;}

#app{max-width:520px; margin:0 auto; display:flex; flex-direction:column; min-height:100%;}

/* ---------- HOME ---------- */
.home-head{padding-block:8px 16px; display:flex; flex-direction:column; gap:4px;}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand h1{font-size:28px; font-weight:700; letter-spacing:.02em;}
.brand .stamp{
  font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.08em;
  color:var(--accent-ink); background:var(--accent); padding:3px 7px; border-radius:3px;
  transform:rotate(-3deg); white-space:nowrap;
}
.tagline{color:var(--ink-soft); font-size:13.5px; line-height:1.5; max-width:40ch;}

.cta-primary{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:13px;
  padding:15px 16px; font-weight:700; font-size:15px; width:100%;
  display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px;
}
.cta-primary:active{transform:scale(.99);}

.new-deck-form{display:flex; gap:8px; margin-top:10px;}
.new-deck-form input{flex:1; border:1px solid var(--panel-line); background:var(--panel); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:14px;}
.new-deck-form button{border-radius:10px; padding:11px 14px; font-weight:700; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); white-space:nowrap;}
.new-deck-form button.cancel{background:transparent; color:var(--ink-soft); border-color:var(--panel-line);}

.section-label{
  font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.1em; color:var(--ink-faint);
  margin-top:22px; margin-bottom:9px; text-transform:uppercase; display:flex; justify-content:space-between;
}

.empty-state{border:1px dashed var(--panel-line); border-radius:12px; padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.65;}

.my-deck-list{display:flex; flex-direction:column; gap:10px;}
.my-deck-tile{border:1px solid var(--panel-line); background:var(--panel); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:9px;}
.my-deck-tile .top-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.my-deck-tile .name{font-family:"Shippori Mincho",serif; font-weight:700; font-size:16.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.my-deck-tile .count{font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-faint); white-space:nowrap;}
.my-deck-tile .bar-track{height:5px; border-radius:3px; background:var(--panel-line); overflow:hidden;}
.my-deck-tile .bar-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .3s ease;}
.tile-btns{display:flex; gap:8px;}
.tile-btns button{flex:1; border-radius:9px; padding:9px 10px; font-size:12.5px; font-weight:700; border:1px solid var(--panel-line); background:transparent; color:var(--ink);}
.tile-btns button.study{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.tile-btns button[disabled]{opacity:.45;}

.sample-note{font-size:11.5px; color:var(--ink-faint); line-height:1.55; margin-bottom:8px;}
.sample-strip-wrap{overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.sample-strip{display:flex; gap:8px; width:max-content;}
.sample-pill{flex:0 0 auto; border:1px solid var(--panel-line); background:transparent; color:var(--ink-soft); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; min-width:122px; text-align:left;}
.sample-pill .name{font-size:12.5px; font-weight:700; color:var(--ink);}
.sample-pill .count{font-family:"DM Mono",monospace; font-size:10.5px; color:var(--ink-faint);}

.home-foot{margin-top:20px; color:var(--ink-faint); font-size:12px; line-height:1.6;}

/* ---------- DECK EDIT ---------- */
.deckedit-screen{display:flex; flex-direction:column; gap:4px;}
.deckedit-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.deckedit-name{flex:1; min-width:0;}
.deckedit-name h2{font-size:18px; font-weight:700; cursor:text; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.deckedit-name input{font-size:18px; font-family:"Shippori Mincho",serif; font-weight:700; border:none; border-bottom:2px solid var(--accent); background:transparent; color:var(--ink); width:100%; padding:2px 0;}
.deckedit-name input:focus{outline:none;}

.card-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.card-row{display:flex; align-items:center; gap:8px; border:1px solid var(--panel-line); background:var(--panel); border-radius:10px; padding:11px 12px;}
.card-row .main{flex:1; min-width:0; cursor:pointer; display:flex; flex-direction:column; gap:1px;}
.card-row .w{font-family:"DM Mono",monospace; font-weight:700; font-size:14px;}
.card-row .m{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-row .del{border:none; background:none; color:var(--bad); font-size:17px; padding:4px 7px; line-height:1;}
.card-row .cat-tag{
  font-family:"DM Mono",monospace; font-size:10px; letter-spacing:.04em; color:var(--ink-faint);
  border:1px solid var(--panel-line); border-radius:999px; padding:2px 7px; margin-top:3px; display:inline-block; width:max-content;
}

.filter-chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; margin-top:10px;}
.chip{flex:0 0 auto; border:1px solid var(--panel-line); background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 12px; font-size:12px; font-weight:700; white-space:nowrap;}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.group-header{font-family:"DM Mono",monospace; font-size:10.5px; letter-spacing:.08em; color:var(--ink-faint); margin:14px 0 2px; text-transform:uppercase;}
.group-header:first-child{margin-top:4px;}

.confirm-row{display:flex; gap:8px; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--bad); border-radius:10px; padding:10px 12px; font-size:12.5px;}
.confirm-row .btns{display:flex; gap:6px;}
.confirm-row button{border-radius:7px; padding:7px 11px; font-size:12px; font-weight:700;}
.confirm-row .danger{background:var(--bad); color:#fff; border:none;}
.confirm-row .cancel{background:transparent; border:1px solid var(--panel-line); color:var(--ink);}

.add-card-btn{margin-top:12px; width:100%; border:1px dashed var(--panel-line); background:transparent; color:var(--ink-soft); border-radius:10px; padding:13px; font-weight:700; font-size:13.5px;}
.card-form{margin-top:12px; display:flex; flex-direction:column; gap:10px; border:1px solid var(--panel-line); background:var(--panel); border-radius:12px; padding:14px;}
.card-form .field{display:flex; flex-direction:column; gap:4px;}
.card-form label{font-size:10.5px; color:var(--ink-faint); font-family:"DM Mono",monospace; letter-spacing:.05em; text-transform:uppercase;}
.card-form input, .card-form textarea{border:1px solid var(--panel-line); background:var(--bg); color:var(--ink); border-radius:8px; padding:9px 10px; font-size:13.5px; font-family:inherit; resize:vertical;}
.card-form textarea{min-height:48px;}
.card-form .btn-row{display:flex; gap:8px; margin-top:2px;}
.card-form .btn-row button{flex:1; border-radius:9px; padding:11px; font-weight:700; font-size:13.5px;}
.card-form .save{background:var(--accent); color:var(--accent-ink); border:none;}
.card-form .cancel{background:transparent; border:1px solid var(--panel-line); color:var(--ink);}

.study-cta{margin-top:12px;}
.deck-danger{margin-top:28px; text-align:center;}
.deck-danger button{background:none; border:none; color:var(--ink-faint); font-size:12px; text-decoration:underline; padding:6px;}

/* ---------- STUDY ---------- */
.study-screen{display:flex; flex-direction:column; min-height:100%; gap:14px;}
.study-top{display:flex; align-items:center; gap:12px;}
.back-btn{
  background:none; border:1px solid var(--panel-line); color:var(--ink);
  width:34px; height:34px; border-radius:50%; font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.study-title{flex:1; min-width:0;}
.study-title .cat-name{font-family:"Shippori Mincho",serif; font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.study-title .cat-pos{font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-faint);}

.combo-pill{
  display:flex; align-items:center; gap:5px; font-family:"DM Mono",monospace; font-size:13px;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:999px; padding:5px 10px 5px 8px;
  color:var(--gold); transition:transform .18s ease; flex:none;
}
.combo-pill.pop{transform:scale(1.18);}
.combo-pill .flame{font-size:14px;}

.progress-track{height:4px; border-radius:2px; background:var(--panel); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .25s ease;}

.stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; padding-block:6px; min-height:360px;}

.card-wrap{width:100%; max-width:360px; aspect-ratio:3/4; perspective:1200px; position:relative; touch-action:pan-y;}
.card{
  position:absolute; inset:0; border-radius:18px; cursor:pointer; user-select:none;
  transform-style:preserve-3d; transition:transform .12s ease;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.card.flipped .face-front{transform:rotateY(180deg);}
.card.flipped .face-back{transform:rotateY(0deg);}
.face{
  position:absolute; inset:0; border-radius:18px; backface-visibility:hidden;
  display:flex; flex-direction:column; padding:24px; transition:transform .45s cubic-bezier(.4,.1,.2,1);
}
.face-front{background:var(--card-front); color:var(--card-front-ink); transform:rotateY(0deg); align-items:center; justify-content:center; text-align:center; gap:14px;}
.face-front .pos-tag{
  font-family:"DM Mono",monospace; font-size:11px; letter-spacing:.14em; color:var(--card-front-sub);
  border:1px solid var(--card-front-sub); padding:3px 9px; border-radius:999px;
}
.face-front .eng{font-family:"Shippori Mincho",serif; font-size:38px; font-weight:700; line-height:1.15; word-break:break-word;}
.face-front .hint{font-size:11.5px; color:var(--card-front-sub); margin-top:4px;}
.face-front .icon{font-size:46px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));}

.face-back{background:var(--card-back); color:var(--card-back-ink); transform:rotateY(-180deg); overflow-y:auto; gap:10px;}
.face-back .eng-small{font-family:"DM Mono",monospace; font-size:13px; color:var(--card-back-sub); letter-spacing:.04em;}
.face-back .meaning{font-family:"Shippori Mincho",serif; font-size:23px; font-weight:700; line-height:1.3;}
.face-back .nuance{font-size:13px; line-height:1.6; color:var(--card-back-ink);}
.face-back .ex-en{font-size:14px; line-height:1.5; font-style:italic; border-left:3px solid var(--accent); padding-left:10px; margin-top:2px;}
.face-back .ex-ja{font-size:12.5px; color:var(--card-back-sub); padding-left:13px;}

.swipe-flag{
  position:absolute; top:16px; font-family:"DM Mono",monospace; font-weight:700; font-size:14px;
  letter-spacing:.08em; padding:5px 10px; border-radius:6px; opacity:0; transition:opacity .08s;
}
.swipe-flag.ok{left:16px; color:var(--good); border:2px solid var(--good); transform:rotate(-8deg);}
.swipe-flag.ng{right:16px; color:var(--bad); border:2px solid var(--bad); transform:rotate(8deg);}

.hint-text{text-align:center; font-size:12px; color:var(--ink-faint); min-height:16px;}

.action-row{display:flex; gap:10px; justify-content:center; padding-block:6px 4px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease; pointer-events:none;}
.action-row.show{opacity:1; transform:translateY(0); pointer-events:auto;}
.act-btn{
  flex:1; max-width:160px; border-radius:12px; border:1px solid var(--panel-line); background:var(--panel);
  color:var(--ink); padding:13px 10px; font-size:14px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.act-btn .sub{font-family:"DM Mono",monospace; font-size:10.5px; font-weight:400; color:var(--ink-faint);}
.act-btn.ng{color:var(--bad); border-color:var(--bad);}
.act-btn.ok{color:var(--good); border-color:var(--good);}

/* ---------- SUMMARY ---------- */
.summary{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:18px; text-align:center; padding-block:30px;}
.summary .badge{font-size:52px;}
.summary h2{font-size:24px;}
.summary .stats{display:flex; gap:22px;}
.summary .stat{display:flex; flex-direction:column; gap:2px;}
.summary .stat b{font-family:"DM Mono",monospace; font-size:26px; color:var(--accent);}
.summary .stat span{font-size:11.5px; color:var(--ink-soft);}
.summary-btns{display:flex; flex-direction:column; gap:8px; width:100%; max-width:280px; margin-top:6px;}
.summary-btns button{
  border-radius:12px; padding:12px; font-weight:700; font-size:14px; border:1px solid var(--panel-line);
  background:var(--panel); color:var(--ink);
}
.summary-btns button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

[hidden]{display:none!important;}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms!important; animation-duration:.01ms!important;} }
</style>

 {w:"go",p:"動",c:0,m:"行く",n:"今いる場所から離れて移動する動き。帰ってくる前提の come と対になる方向性を持つ。",ex:"I go to school by bike.",exj:"私は自転車で学校に行く。",ic:"🚶"},

 {w:"tired",p:"形",c:1,m:"疲れている",n:"エネルギーが切れて動きたくない状態。",ex:"I'm too tired to walk.",exj:"歩くのも疲れた。",ic:"😴"},
 {w:"excited",p:"形",c:1,m:"ワクワクしている",n:"これから起きることへの期待で気持ちが高まる状態。",ex:"We're excited about the trip.",exj:"私たちは旅行にワクワクしている。",ic:"🤩"},

});

/* ---------------- storage ---------------- */
var STORE_KEY = "worddojo_progress_v1";
var DECKS_KEY = "worddojo_custom_decks_v1";

function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return {known:{}, bestCombo:0};
    var parsed = JSON.parse(raw);
    if(!parsed.known) parsed.known = {};
    if(typeof parsed.bestCombo !== "number") parsed.bestCombo = 0;
    return parsed;
  }catch(e){ return {known:{}, bestCombo:0}; }
}
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
var store = loadStore();

function loadDecks(){
  try{
    var raw = localStorage.getItem(DECKS_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveDecks(d){ try{ localStorage.setItem(DECKS_KEY, JSON.stringify(d)); }catch(e){} }
var decks = loadDecks();

function getDeck(id){ for(var i=0;i<decks.length;i++){ if(decks[i].id===id) return decks[i]; } return null; }
function createDeck(name){
  var d = {id:"d"+Date.now()+Math.floor(Math.random()*1000), name:name, cards:[]};
  decks.push(d); saveDecks(decks); return d;
}
function renameDeck(id, name){ var d=getDeck(id); if(d){ d.name=name; saveDecks(decks); } }
function deleteDeck(id){
  decks = decks.filter(function(d){ return d.id!==id; });
  saveDecks(decks);
  delete store.known["custom_"+id];
  saveStore(store);
}
function addCard(deckId, card){
  var d = getDeck(deckId); if(!d) return null;
  card.id = "c"+Date.now()+Math.floor(Math.random()*1000);
  d.cards.push(card); saveDecks(decks); return card;
}
function updateCard(deckId, cardId, data){
  var d = getDeck(deckId); if(!d) return;
  for(var i=0;i<d.cards.length;i++){
    if(d.cards[i].id===cardId){ d.cards[i].w=data.w; d.cards[i].m=data.m; d.cards[i].ex=data.ex; d.cards[i].exj=data.exj; d.cards[i].n=data.n; d.cards[i].cat=data.cat; break; }
  }
  saveDecks(decks);
}
function deckCategories(deck){
  var seen = {}; var list = [];
  deck.cards.forEach(function(c){
    var cat = (c.cat||"").trim();
    if(cat && !seen[cat]){ seen[cat]=true; list.push(cat); }
  });
  return list;
}
function deleteCard(deckId, cardId){
  var d = getDeck(deckId); if(!d) return;
  d.cards = d.cards.filter(function(c){ return c.id!==cardId; });
  saveDecks(decks);
  var sid = "custom_"+deckId;
  var arr = store.known[sid];
  if(arr){ store.known[sid] = arr.filter(function(k){ return k!==cardId; }); saveStore(store); }
}

function knownSet(sid){ return store.known[sid] || []; }
function markKnown(sid, key){
  var arr = store.known[sid] || [];
  if(arr.indexOf(key)===-1){ arr.push(key); store.known[sid]=arr; saveStore(store); }
}
function unmarkKnown(sid, key){
  var arr = store.known[sid] || [];
  var i = arr.indexOf(key);
  if(i!==-1){ arr.splice(i,1); store.known[sid]=arr; saveStore(store); }
}

/* ---------------- source abstraction (sample category or custom deck) ---------------- */
function sourceId(source){ return source.type==="sample" ? ("sample_"+source.idx) : ("custom_"+source.deckId); }
function sourceName(source){
  if(source.type==="sample") return SAMPLE_CATS[source.idx].name;
  var name = (getDeck(source.deckId)||{}).name || "単語帳";
  if(source.cat!=null) name += " ・ " + (source.cat || "未分類");
  return name;
}
function sourceCards(source){
  if(source.type==="sample"){
    return SAMPLE_CATS[source.idx].words.map(function(wi){ return {key:wi, data:SAMPLE_WORDS[wi]}; });
  }
  var d = getDeck(source.deckId);
  if(!d) return [];
  var cards = d.cards;
  if(source.cat!=null){ cards = cards.filter(function(c){ return (c.cat||"")===source.cat; }); }
  return cards.map(function(c){ return {key:c.id, data:c}; });
}

  results:{ok:0,ng:0}, missed:[]
};

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

    '<div id="newDeckFormWrap"></div>' +
    '<div class="section-label"><span>マイ単語帳</span><span>'+decks.length+'</span></div>';

  if(decks.length===0){
    html += '<div class="empty-state">まだ単語帳がありません。上のボタンから作って、覚えたい単語をどんどん追加していきましょう。</div>';
  } else {
    html += '<div class="my-deck-list">';
    decks.forEach(function(d){
      var total = d.cards.length;
      var got = knownSet("custom_"+d.id).filter(function(k){ return d.cards.some(function(c){return c.id===k;}); }).length;
      var pct = total ? Math.round(got/total*100) : 0;
      html += '<div class="my-deck-tile" data-deck="'+esc(d.id)+'">' +
        '<div class="top-row"><span class="name">'+esc(d.name)+'</span><span class="count mono">'+total+' 語</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="tile-btns">' +
          '<button class="study" data-act="study" data-deck="'+esc(d.id)+'"'+(total===0?" disabled":"")+'>学習する</button>' +
          '<button data-act="edit" data-deck="'+esc(d.id)+'">編集する</button>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  html += '<div class="section-label"><span>付属のサンプル</span></div>' +
    '<div class="sample-note">最初から入っている練習用の例です。自分の単語帳を作る前にお試しで触ってみてください。</div>' +
    '<div class="sample-strip-wrap"><div class="sample-strip">';
  SAMPLE_CATS.forEach(function(cat){
    var total = cat.words.length;
    var got = knownSet("sample_"+cat.idx).length;
    html += '<button class="sample-pill" data-act="sample" data-idx="'+cat.idx+'">' +
      '<span class="name">'+esc(cat.name)+'</span>' +
      '<span class="count mono">'+got+' / '+total+'</span>' +
    '</button>';
  });
  html += '</div></div>' +
    '<div class="home-foot">最高コンボ <b class="mono" style="color:var(--gold)">'+(store.bestCombo||0)+'</b> ・ データはこの端末だけに保存されます。</div>';

  app.innerHTML = html;

  document.getElementById("newDeckBtn").addEventListener("click", function(){
    state.newDeckOpen = !state.newDeckOpen;
    renderNewDeckForm();
  });
  renderNewDeckForm();

  app.querySelectorAll('[data-act="study"]').forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(btn.disabled) return;
      startStudy({type:"custom", deckId:btn.getAttribute("data-deck")});
    });
  });
  app.querySelectorAll('[data-act="edit"]').forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      openDeckEdit(btn.getAttribute("data-deck"));
    });
  });
  app.querySelectorAll('[data-act="sample"]').forEach(function(btn){
    btn.addEventListener("click", function(){
      startStudy({type:"sample", idx:parseInt(btn.getAttribute("data-idx"),10)});
    });
  });
}

function renderNewDeckForm(){
  var wrap = document.getElementById("newDeckFormWrap");
  if(!wrap) return;
  if(!state.newDeckOpen){ wrap.innerHTML = ""; return; }
  wrap.innerHTML =
    '<div class="new-deck-form">' +
      '<input type="text" id="newDeckName" placeholder="単語帳の名前(例: 今週のテスト範囲)" maxlength="40">' +
      '<button id="newDeckCreate">作成</button>' +
      '<button class="cancel" id="newDeckCancel">やめる</button>' +
    '</div>';
  var input = document.getElementById("newDeckName");
  input.focus();
  function submit(){
    var name = input.value.trim();
    if(!name) { input.focus(); return; }
    var d = createDeck(name);
    state.newDeckOpen = false;
    openDeckEdit(d.id);
  }
  document.getElementById("newDeckCreate").addEventListener("click", submit);
  document.getElementById("newDeckCancel").addEventListener("click", function(){ state.newDeckOpen=false; renderNewDeckForm(); });
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
}

/* ===================== DECK EDIT ===================== */
function openDeckEdit(deckId){
  if(!getDeck(deckId)){ state.screen="home"; renderHome(); return; }
  state.screen = "deckEdit";
  state.editingDeckId = deckId;
  state.editingDeckRename = false;
  state.filterCat = null;
  state.addCardOpen = false;
  state.editingCardId = null;
  state.pendingDeleteCardId = null;
  state.pendingDeleteDeck = false;
  renderDeckEdit();
}

function renderDeckEdit(){
  var deck = getDeck(state.editingDeckId);
  if(!deck){ state.screen="home"; renderHome(); return; }

  var html = '<div class="deckedit-screen">' +
    '<div class="deckedit-head">' +
      '<button class="back-btn" id="backBtn">←</button>' +
      '<div class="deckedit-name" id="deckNameWrap"></div>' +
    '</div>';

  var cats = deckCategories(deck);
  var filterCards = deck.cards;
  if(state.filterCat !== null){ filterCards = deck.cards.filter(function(c){ return (c.cat||"")===state.filterCat; }); }

  if(filterCards.length>0){
    html += '<button class="cta-primary study-cta" id="studyBtn">学習を始める('+filterCards.length+'語)</button>';
  }

  html += '<div class="section-label"><span>単語</span><span>'+deck.cards.length+'</span></div>';

  if(cats.length>0){
    html += '<div class="filter-chips">';
    html += '<button class="chip'+(state.filterCat===null?' active':'')+'" data-act="filterAll">すべて('+deck.cards.length+')</button>';
    cats.forEach(function(cat){
      var n = deck.cards.filter(function(c){ return (c.cat||"")===cat; }).length;
      html += '<button class="chip'+(state.filterCat===cat?' active':'')+'" data-act="filter" data-cat="'+esc(cat)+'">'+esc(cat)+'('+n+')</button>';
    });
    var uncatN = deck.cards.filter(function(c){ return !(c.cat||"").trim(); }).length;
    if(uncatN>0){
      html += '<button class="chip'+(state.filterCat===""?' active':'')+'" data-act="filter" data-cat="">未分類('+uncatN+')</button>';
    }
    html += '</div>';
  }

  function cardRowHtml(c){
    if(state.pendingDeleteCardId===c.id){
      return '<div class="confirm-row"><span>「'+esc(c.w)+'」を削除しますか?</span><div class="btns">' +
        '<button class="danger" data-act="confirmDelCard" data-id="'+esc(c.id)+'">削除する</button>' +
        '<button class="cancel" data-act="cancelDelCard">キャンセル</button>' +
      '</div></div>';
    }
    var catTag = (c.cat||"").trim() ? '<span class="cat-tag">'+esc(c.cat)+'</span>' : '';
    return '<div class="card-row">' +
      '<div class="main" data-act="editCard" data-id="'+esc(c.id)+'"><span class="w">'+esc(c.w)+'</span><span class="m">'+esc(c.m)+'</span>'+catTag+'</div>' +
      '<button class="del" data-act="delCard" data-id="'+esc(c.id)+'">✕</button>' +
    '</div>';
  }

  if(deck.cards.length===0 && !state.addCardOpen){
    html += '<div class="empty-state">まだ単語がありません。下のボタンから追加しましょう。</div>';
  } else if(filterCards.length===0){
    html += '<div class="empty-state">このカテゴリーの単語はまだありません。</div>';
  } else {
    html += '<div class="card-list">';
    if(state.filterCat===null && cats.length>0){
      cats.forEach(function(cat){
        var rows = deck.cards.filter(function(c){ return (c.cat||"")===cat; });
        if(rows.length===0) return;
        html += '<div class="group-header">'+esc(cat)+'</div>';
        rows.forEach(function(c){ html += cardRowHtml(c); });
      });
      var uncatRows = deck.cards.filter(function(c){ return !(c.cat||"").trim(); });
      if(uncatRows.length>0){
        html += '<div class="group-header">未分類</div>';
        uncatRows.forEach(function(c){ html += cardRowHtml(c); });
      }
    } else {
      filterCards.forEach(function(c){ html += cardRowHtml(c); });
    }
    html += '</div>';
  }

  if(!state.addCardOpen && !state.editingCardId){
    html += '<button class="add-card-btn" id="addCardBtn">＋ 単語を追加</button>';
  } else {
    html += renderCardFormHtml();
  }

  html += '<div class="deck-danger">' +
    (state.pendingDeleteDeck
      ? '<div class="confirm-row"><span>「'+esc(deck.name)+'」を削除しますか?(元に戻せません)</span><div class="btns"><button class="danger" id="confirmDelDeck">削除する</button><button class="cancel" id="cancelDelDeck">キャンセル</button></div></div>'
      : '<button id="delDeckBtn">この単語帳を削除</button>') +
  '</div></div>';

  app.innerHTML = html;
  renderDeckNameHead(deck);
  wireDeckEdit(deck);
}

function renderDeckNameHead(deck){
  var wrap = document.getElementById("deckNameWrap");
  if(!wrap) return;
  if(state.editingDeckRename){
    wrap.innerHTML = '<input type="text" id="deckRenameInput" maxlength="40" value="'+esc(deck.name)+'">';
    var input = document.getElementById("deckRenameInput");
    input.focus(); input.select();
    function commit(){
      var v = input.value.trim();
      if(v) renameDeck(deck.id, v);
      state.editingDeckRename = false;
      renderDeckEdit();
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") commit(); });
  } else {
    wrap.innerHTML = '<h2 id="deckNameLabel">'+esc(deck.name)+'</h2>';
    document.getElementById("deckNameLabel").addEventListener("click", function(){
      state.editingDeckRename = true; renderDeckNameHead(deck);
    });
  }
}

function renderCardFormHtml(){
  var deck = getDeck(state.editingDeckId);
  var editing = null;
  if(state.editingCardId){
    editing = deck.cards.find(function(c){ return c.id===state.editingCardId; });
  }
  var v = editing || {w:"",m:"",ex:"",exj:"",n:"",cat:state.addCardDefaultCat||""};
  var cats = deckCategories(deck);
  var datalist = '<datalist id="catSuggest">' + cats.map(function(c){ return '<option value="'+esc(c)+'">'; }).join("") + '</datalist>';
  return '<div class="card-form" id="cardForm">' +
    '<div class="field"><label>英単語・フレーズ(必須)</label><input type="text" id="cfWord" value="'+esc(v.w)+'" placeholder="例: consider"></div>' +
    '<div class="field"><label>意味(必須)</label><input type="text" id="cfMeaning" value="'+esc(v.m)+'" placeholder="例: 〜を考慮する"></div>' +
    '<div class="field"><label>カテゴリー(任意)</label><input type="text" id="cfCat" list="catSuggest" value="'+esc(v.cat||"")+'" placeholder="例: 動詞 / 第3章 など自由入力">'+datalist+'</div>' +
    '<div class="field"><label>ひとこと解説(任意)</label><textarea id="cfNote" placeholder="ネイティブ感覚のニュアンスなど">'+esc(v.n)+'</textarea></div>' +
    '<div class="field"><label>例文(任意)</label><input type="text" id="cfEx" value="'+esc(v.ex)+'" placeholder="例: Please consider my idea."></div>' +
    '<div class="field"><label>例文の訳(任意)</label><input type="text" id="cfExj" value="'+esc(v.exj)+'" placeholder="例: 私の考えを検討してください。"></div>' +
    '<div class="btn-row"><button class="save" id="cfSave">保存</button><button class="cancel" id="cfCancel">キャンセル</button></div>' +
  '</div>';
}

function wireDeckEdit(deck){
  document.getElementById("backBtn").addEventListener("click", function(){ state.screen="home"; renderHome(); });

  var studyBtn = document.getElementById("studyBtn");
  if(studyBtn) studyBtn.addEventListener("click", function(){
    var src = {type:"custom", deckId:deck.id};
    if(state.filterCat !== null) src.cat = state.filterCat;
    startStudy(src);
  });

  app.querySelectorAll('[data-act="filterAll"]').forEach(function(el){
    el.addEventListener("click", function(){ state.filterCat = null; renderDeckEdit(); });
  });
  app.querySelectorAll('[data-act="filter"]').forEach(function(el){
    el.addEventListener("click", function(){ state.filterCat = el.getAttribute("data-cat"); renderDeckEdit(); });
  });

  app.querySelectorAll('[data-act="editCard"]').forEach(function(el){
    el.addEventListener("click", function(){
      state.editingCardId = el.getAttribute("data-id");
      state.addCardOpen = false;
      state.pendingDeleteCardId = null;
      renderDeckEdit();
    });
  });
  app.querySelectorAll('[data-act="delCard"]').forEach(function(el){
    el.addEventListener("click", function(){
      state.pendingDeleteCardId = el.getAttribute("data-id");
      renderDeckEdit();
    });
  });
  var confirmDel = document.querySelector('[data-act="confirmDelCard"]');
  if(confirmDel) confirmDel.addEventListener("click", function(){
    deleteCard(deck.id, confirmDel.getAttribute("data-id"));
    state.pendingDeleteCardId = null;
    renderDeckEdit();
  });
  var cancelDel = document.querySelector('[data-act="cancelDelCard"]');
  if(cancelDel) cancelDel.addEventListener("click", function(){ state.pendingDeleteCardId = null; renderDeckEdit(); });

  var addBtn = document.getElementById("addCardBtn");
  if(addBtn) addBtn.addEventListener("click", function(){
    state.addCardOpen = true; state.editingCardId = null;
    state.addCardDefaultCat = (state.filterCat && state.filterCat!=="") ? state.filterCat : "";
    renderDeckEdit();
    setTimeout(function(){ var el=document.getElementById("cfWord"); if(el) el.focus(); }, 0);
  });

  var cfSave = document.getElementById("cfSave");
  if(cfSave) cfSave.addEventListener("click", function(){
    var w = document.getElementById("cfWord").value.trim();
    var m = document.getElementById("cfMeaning").value.trim();
    if(!w || !m){
      if(!w) document.getElementById("cfWord").focus(); else document.getElementById("cfMeaning").focus();
      return;
    }
    var data = {
      w:w, m:m,
      cat:document.getElementById("cfCat").value.trim(),
      n:document.getElementById("cfNote").value.trim(),
      ex:document.getElementById("cfEx").value.trim(),
      exj:document.getElementById("cfExj").value.trim()
    };
    if(state.editingCardId){ updateCard(deck.id, state.editingCardId, data); }
    else { addCard(deck.id, data); }
    state.addCardOpen = false; state.editingCardId = null;
    renderDeckEdit();
  });
  var cfCancel = document.getElementById("cfCancel");
  if(cfCancel) cfCancel.addEventListener("click", function(){
    state.addCardOpen = false; state.editingCardId = null; renderDeckEdit();
  });

  var delDeckBtn = document.getElementById("delDeckBtn");
  if(delDeckBtn) delDeckBtn.addEventListener("click", function(){ state.pendingDeleteDeck = true; renderDeckEdit(); });
  var confirmDelDeck = document.getElementById("confirmDelDeck");
  if(confirmDelDeck) confirmDelDeck.addEventListener("click", function(){
    deleteDeck(deck.id); state.screen="home"; renderHome();
  });
  var cancelDelDeck = document.getElementById("cancelDelDeck");
  if(cancelDelDeck) cancelDelDeck.addEventListener("click", function(){ state.pendingDeleteDeck=false; renderDeckEdit(); });
}

/* ===================== STUDY ===================== */
function startStudy(source){
  var cards = sourceCards(source);
  if(cards.length===0){ return; }
  state.screen = "study";
  state.source = source;
  state.cardsSnapshot = cards;
  state.order = shuffle(cards.map(function(c,i){ return i; }));
  state.pos = 0; state.flipped = false; state.combo = 0; state.sessionBest = 0;
  state.results = {ok:0, ng:0}; state.missed = [];
  renderStudy();
}

function currentCard(){ return state.cardsSnapshot[state.order[state.pos]]; }

function renderStudy(){
  if(state.pos >= state.order.length){ renderSummary(); return; }
  var total = state.order.length;
  var c = currentCard();
  var w = c.data;
  var pos = w.p || "";
  var ic = w.ic || "📝";
  var html = '<div class="study-screen">' +
    '<div class="study-top">' +
      '<button class="back-btn" id="backBtn">←</button>' +
      '<div class="study-title"><div class="cat-name">'+esc(sourceName(state.source))+'</div><div class="cat-pos mono">'+(state.pos+1)+' / '+total+'</div></div>' +
      '<div class="combo-pill" id="comboPill"><span class="flame">🔥</span><span id="comboNum">'+state.combo+'</span></div>' +
    '</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(state.pos/total*100)+'%"></div></div>' +
    '<div class="stage">' +
      '<div class="card-wrap" id="cardWrap">' +
        '<div class="swipe-flag ok" id="flagOk">覚えた</div>' +
        '<div class="swipe-flag ng" id="flagNg">まだ</div>' +
        '<div class="card" id="card">' +
          '<div class="face face-front">' +
            '<span class="icon">'+ic+'</span>' +
            (pos ? '<span class="pos-tag">'+esc(pos)+'</span>' : '') +
            '<span class="eng">'+esc(w.w)+'</span>' +
            '<span class="hint">タップして意味を見る</span>' +
          '</div>' +
          '<div class="face face-back">' +
            '<span class="eng-small mono">'+esc(w.w)+(pos?' ・ '+esc(pos):'')+'</span>' +
            '<span class="meaning">'+esc(w.m)+'</span>' +
            (w.n ? '<span class="nuance">'+esc(w.n)+'</span>' : '') +
            (w.ex ? '<span class="ex-en">"'+esc(w.ex)+'"</span>' : '') +
            (w.exj ? '<span class="ex-ja">'+esc(w.exj)+'</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="hint-text" id="hintText">タップでカードをめくる</div>' +
    '</div>' +
    '<div class="action-row" id="actionRow">' +
      '<button class="act-btn ng" id="btnNg">まだ<span class="sub">もう一度</span></button>' +
      '<button class="act-btn ok" id="btnOk">覚えた!<span class="sub">次へ</span></button>' +
    '</div>' +
  '</div>';
  app.innerHTML = html;
  wireStudy();
}

function wireStudy(){
  document.getElementById("backBtn").addEventListener("click", function(){ goBackFromStudy(); });
  var card = document.getElementById("card");
  var wrap = document.getElementById("cardWrap");
  var actionRow = document.getElementById("actionRow");
  var hintText = document.getElementById("hintText");
  var flagOk = document.getElementById("flagOk");
  var flagNg = document.getElementById("flagNg");

  var dragging=false, startX=0, startY=0, dx=0, moved=false;

  function flip(){
    if(state.flipped) return;
    state.flipped = true;
    card.classList.add("flipped");
    actionRow.classList.add("show");
    hintText.textContent = "分かったら右へ、まだなら左へスワイプ(またはボタン)";
  }
  function resetDrag(){
    card.style.transform = "";
    flagOk.style.opacity = 0;
    flagNg.style.opacity = 0;
  }
  function onDown(e){
    var pt = e.touches ? e.touches[0] : e;
    dragging = true; moved=false; startX = pt.clientX; startY = pt.clientY; dx=0;
  }
  function onMove(e){
    if(!dragging) return;
    var pt = e.touches ? e.touches[0] : e;
    dx = pt.clientX - startX;
    var dy = pt.clientY - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if(state.flipped && moved){
      card.style.transform = "translateX("+dx+"px) rotate("+(dx/14)+"deg)";
      flagOk.style.opacity = Math.max(0, Math.min(1, dx/70));
      flagNg.style.opacity = Math.max(0, Math.min(1, -dx/70));
    }
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    if(!state.flipped){
      if(!moved) flip();
      return;
    }
    if(Math.abs(dx) > 80){ resolveCard(dx > 0); }
    else { resetDrag(); }
  }

  wrap.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  wrap.addEventListener("touchstart", onDown, {passive:true});
  wrap.addEventListener("touchmove", onMove, {passive:true});
  wrap.addEventListener("touchend", onUp);

  document.getElementById("btnOk").addEventListener("click", function(){ resolveCard(true); });
  document.getElementById("btnNg").addEventListener("click", function(){ resolveCard(false); });
}

function goBackFromStudy(){
  if(state.source && state.source.type==="custom"){ openDeckEdit(state.source.deckId); }
  else { state.screen="home"; renderHome(); }
}

function resolveCard(ok){
  var sid = sourceId(state.source);
  var key = currentCard().key;
  var posInOrder = state.order[state.pos];
  if(ok){
    state.combo += 1;
    state.sessionBest = Math.max(state.sessionBest, state.combo);
    state.results.ok += 1;
    markKnown(sid, key);
    if(state.combo > (store.bestCombo||0)){ store.bestCombo = state.combo; saveStore(store); }
    popCombo();
  } else {
    state.combo = 0;
    state.results.ng += 1;
    state.missed.push(posInOrder);
    unmarkKnown(sid, key);
    var num = document.getElementById("comboNum");
    if(num) num.textContent = state.combo;
  }
  state.pos += 1;
  state.flipped = false;
  setTimeout(renderStudy, 140);
}

function popCombo(){
  var pill = document.getElementById("comboPill");
  var num = document.getElementById("comboNum");
  if(num) num.textContent = state.combo;
  if(pill){ pill.classList.add("pop"); setTimeout(function(){ pill.classList.remove("pop"); }, 180); }
}

function renderSummary(){
  var total = state.order.length;
  var badge = state.results.ok === total ? "🏆" : (state.sessionBest >= 5 ? "🔥" : "🎴");
  var isCustom = state.source && state.source.type==="custom";
  var html = '<div class="summary">' +
    '<span class="badge">'+badge+'</span>' +
    '<h2>'+esc(sourceName(state.source))+' クリア</h2>' +
    '<div class="stats">' +
      '<div class="stat"><b class="mono">'+state.results.ok+'/'+total+'</b><span>覚えた</span></div>' +
      '<div class="stat"><b class="mono" style="color:var(--gold)">'+state.sessionBest+'</b><span>最高コンボ</span></div>' +
    '</div>' +
    '<div class="summary-btns">' +
      (state.missed.length ? '<button class="primary" id="retryMissed">まだのカードだけもう一度('+state.missed.length+')</button>' : '') +
      '<button id="retryAll">同じ束を全部もう一度</button>' +
      (isCustom ? '<button id="toEdit">単語を編集する</button>' : '') +
      '<button id="toHome">道場に戻る</button>' +
    '</div>' +
  '</div>';
  app.innerHTML = html;
  var retryMissed = document.getElementById("retryMissed");
  if(retryMissed){
    retryMissed.addEventListener("click", function(){
      state.order = shuffle(state.missed.slice());
      state.pos=0; state.flipped=false; state.combo=0; state.sessionBest=0;
      state.results={ok:0,ng:0}; state.missed=[];
      renderStudy();
    });
  }
  document.getElementById("retryAll").addEventListener("click", function(){ startStudy(state.source); });
  var toEdit = document.getElementById("toEdit");
  if(toEdit) toEdit.addEventListener("click", function(){ openDeckEdit(state.source.deckId); });
  document.getElementById("toHome").addEventListener("click", function(){ state.screen="home"; renderHome(); });
}

/* ===================== boot ===================== */
function boot(data){
  if(data && data.store) store = data.store;
  if(data && data.decks) decks = data.decks;
  renderHome();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(function(){ return {store:store, decks:decks}; });
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
} else {
  boot({});
}

})();
</script>
